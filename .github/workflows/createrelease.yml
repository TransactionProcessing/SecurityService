name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: "Release"
    env:
        ASPNETCORE_ENVIRONMENT: "Production"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2.3.4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
    
    - name: Get the version
      id: get_version
      run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}

    - name: Restore Nuget Packages
      run: dotnet restore SecurityService.slnx --source ${{ secrets.PUBLICFEEDURL }} --source ${{ secrets.PRIVATEFEED_URL }}

    - name: Build Code
      run: dotnet build SecurityService.slnx --configuration Release      
   
    - name: Publish Images to Docker Hub - Pre Release
      if: ${{ github.event.release.prerelease == true }} 
      run: |
        docker build . --file SecurityService/Dockerfile --tag stuartferguson/securityservice:dev
        docker login --username=${{ secrets.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }}
        docker push stuartferguson/securityservice:dev

    - name: Publish Images to Docker Hub - Formal Release
      if: ${{ github.event.release.prerelease == false }} 
      run: |
        docker build . --file SecurityService/Dockerfile --tag stuartferguson/securityservice:latest
        docker login --username=${{ secrets.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }}
        docker push stuartferguson/securityservice:latest
    
    - name: Publish API
      if: ${{ github.event.release.prerelease == false }} 
      run: dotnet publish "SecurityService\SecurityService.csproj" --configuration Release --output publishOutput -r win-x64 --self-contained  
              -p:Version=${{ steps.get_version.outputs.VERSION }}
              -p:AssemblyVersion=${{ steps.get_version.outputs.VERSION }}
              -p:FileVersion=${{ steps.get_version.outputs.VERSION }}
              -p:InformationalVersion=${{ steps.get_version.outputs.VERSION }}           

    - name: Build Release Package
      run: |
         cd /home/runner/work/SecurityService/SecurityService/publishOutput
         zip -r ../securityservice.zip ./*

    - name: Upload the artifact
      uses: actions/upload-artifact@v4
      with:
        name: securityservice
        path: securityservice.zip

    - name: Build and Publish Nuget Packages
      if: ${{ github.event.release.prerelease == false }} 
      run: |
        dotnet pack "SecurityService.Client\SecurityService.Client.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets
        dotnet nuget push Nugets/SecurityService.Client.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }} --skip-duplicate 
        dotnet pack "SecurityService.IntegrationTesting.Helpers\SecurityService.IntegrationTesting.Helpers.csproj" /p:PackageVersion=${{ steps.get_version.outputs.VERSION }} --output Nugets -c Release            
        dotnet nuget push Nugets/SecurityService.IntegrationTesting.Helpers.${{ steps.get_version.outputs.VERSION }}.nupkg --api-key ${{ secrets.PRIVATEFEED_APIKEY }} --source ${{ secrets.PRIVATEFEED_URL }} --skip-duplicate         
        
  deploystaging:
      runs-on: [stagingserver, windows]
      needs: build
      environment: staging
      name: "Deploy to Staging"
      env:
        SECURITYSERVICE_CERTIFICATE_PATH: ${{ secrets.SECURITYSERVICE_CERTIFICATE_PATH }}
        SECURITYSERVICE_CERTIFICATE_PASSWORD: ${{ secrets.SECURITYSERVICE_CERTIFICATE_PASSWORD }}
        AUTHENTICATION_DB_CONNECTION_STRING: ${{ secrets.AUTHENTICATION_DB_CONNECTION_STRING }}

      steps:
      - name: Download the artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: securityservice

      - name: Validate HTTPS certificate configuration
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SECURITYSERVICE_CERTIFICATE_PATH) -or [string]::IsNullOrWhiteSpace($env:SECURITYSERVICE_CERTIFICATE_PASSWORD)) {
            throw "The staging environment must define SECURITYSERVICE_CERTIFICATE_PATH and SECURITYSERVICE_CERTIFICATE_PASSWORD."
          }
          if ([string]::IsNullOrWhiteSpace($env:AUTHENTICATION_DB_CONNECTION_STRING)) {
            throw "The staging environment must define AUTHENTICATION_DB_CONNECTION_STRING."
          }
          if (-not (Test-Path -LiteralPath $env:SECURITYSERVICE_CERTIFICATE_PATH -PathType Leaf)) {
            throw "The configured SecurityService certificate file is missing on the staging host."
          }
          
      - name: Remove existing  Windows service
        run: |
          $serviceName = "Transaction Processing - Security Service"
          # Check if the service exists
          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            Stop-Service -Name $serviceName
            sc.exe delete $serviceName
          }

      - name: Unzip the files
        run: |
          Expand-Archive -Path securityservice.zip -DestinationPath "C:\txnproc\transactionprocessing\securityservice" -Force
      
      - name: Install as a Windows service
        run: |
          $serviceName = "Transaction Processing - Security Service"
          $servicePath = "C:\txnproc\transactionprocessing\securityservice\SecurityService.exe"
          $configurationPath = "C:\txnproc\transactionprocessing\securityservice\appsettings.local.json"
          $configuration = @{
            ConnectionStrings = @{
              AuthenticationDbContext = $env:AUTHENTICATION_DB_CONNECTION_STRING
            }
          } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText($configurationPath, $configuration, [System.Text.UTF8Encoding]::new($false))
          icacls $configurationPath /inheritance:r /grant:r "*S-1-5-18:(R)" "*S-1-5-32-544:(M)"
          if ($LASTEXITCODE -ne 0) { throw "Could not restrict access to the deployment configuration file." }
          New-Service -Name $serviceName -BinaryPathName $servicePath -Description $serviceName -DisplayName $serviceName -StartupType Automatic
          $serviceKey = "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName"
          $serviceEnvironment = @(
            "ServiceOptions__KestrelOptions__Path=$($env:SECURITYSERVICE_CERTIFICATE_PATH)",
            "ServiceOptions__KestrelOptions__Password=$($env:SECURITYSERVICE_CERTIFICATE_PASSWORD)"
          )
          New-ItemProperty -Path $serviceKey -Name Environment -PropertyType MultiString -Value $serviceEnvironment -Force | Out-Null
          Start-Service -Name $serviceName

  deployproduction:
    runs-on: [productionserver, windows]
    needs: [build, deploystaging]
    environment: production
    name: "Deploy to Production"
    env:
      SECURITYSERVICE_CERTIFICATE_PATH: ${{ secrets.SECURITYSERVICE_CERTIFICATE_PATH }}
      SECURITYSERVICE_CERTIFICATE_PASSWORD: ${{ secrets.SECURITYSERVICE_CERTIFICATE_PASSWORD }}
      AUTHENTICATION_DB_CONNECTION_STRING: ${{ secrets.AUTHENTICATION_DB_CONNECTION_STRING }}
    
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: securityservice

      - name: Validate HTTPS certificate configuration
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SECURITYSERVICE_CERTIFICATE_PATH) -or [string]::IsNullOrWhiteSpace($env:SECURITYSERVICE_CERTIFICATE_PASSWORD)) {
            throw "The production environment must define SECURITYSERVICE_CERTIFICATE_PATH and SECURITYSERVICE_CERTIFICATE_PASSWORD."
          }
          if ([string]::IsNullOrWhiteSpace($env:AUTHENTICATION_DB_CONNECTION_STRING)) {
            throw "The production environment must define AUTHENTICATION_DB_CONNECTION_STRING."
          }
          if (-not (Test-Path -LiteralPath $env:SECURITYSERVICE_CERTIFICATE_PATH -PathType Leaf)) {
            throw "The configured SecurityService certificate file is missing on the production host."
          }
  
      - name: Remove existing  Windows service
        run: |
          $serviceName = "Transaction Processing - Security Service"
          # Check if the service exists
          if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
            Stop-Service -Name $serviceName
            sc.exe delete $serviceName
          }

      - name: Unzip the files
        run: |
          Expand-Archive -Path securityservice.zip -DestinationPath "C:\txnproc\transactionprocessing\securityservice" -Force
      
      - name: Install as a Windows service
        run: |
          $serviceName = "Transaction Processing - Security Service"
          $servicePath = "C:\txnproc\transactionprocessing\securityservice\SecurityService.exe"
          $configurationPath = "C:\txnproc\transactionprocessing\securityservice\appsettings.local.json"
          $configuration = @{
            ConnectionStrings = @{
              AuthenticationDbContext = $env:AUTHENTICATION_DB_CONNECTION_STRING
            }
          } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText($configurationPath, $configuration, [System.Text.UTF8Encoding]::new($false))
          icacls $configurationPath /inheritance:r /grant:r "*S-1-5-18:(R)" "*S-1-5-32-544:(M)"
          if ($LASTEXITCODE -ne 0) { throw "Could not restrict access to the deployment configuration file." }
          New-Service -Name $serviceName -BinaryPathName $servicePath -Description $serviceName -DisplayName $serviceName -StartupType Automatic
          $serviceKey = "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName"
          $serviceEnvironment = @(
